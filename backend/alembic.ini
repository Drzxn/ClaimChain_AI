# Alembic configuration for ClaimChain AI.
#
# The database URL is NOT set here. It is read from the application settings
# (which read DATABASE_URL from the environment / .env) in alembic/env.py.
# This keeps one source of truth and keeps credentials out of a tracked file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timestamp-prefixed revisions sort chronologically in the versions directory.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
